[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/desktop/src-tauri",
  "crates/aro-agent",
  "crates/aro-agent-domain",
  "crates/aro-core",
  "crates/aro-files",
  "crates/aro-memory",
  "crates/aro-policy",
  "crates/aro-integrations",
  "crates/aro-secrets",
  "crates/aro-store",
  "crates/aro-tools",
  "crates/aro-mcp",
  "crates/aro-skills",
  "crates/aro-plugins",
  "crates/aro-runtime",
  "crates/aro-vector",
  "crates/aro-voice",
]

[workspace.package]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Hakille-ai/Aro"
rust-version = "1.95"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = "9"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls", "ring", "webpki-roots"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
redis = { version = "1.3.0", default-features = false, features = ["tokio-comp", "connection-manager", "script", "streams"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
scraper = "0.24"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "io-util"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = "1"
