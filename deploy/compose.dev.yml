name: aro

services:
  postgres:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    container_name: aro-postgres
    environment:
      POSTGRES_USER: aro
      POSTGRES_PASSWORD: aro
      POSTGRES_DB: aro
    ports:
      - "5432:5432"
    volumes:
      - aro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aro -d aro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: aro-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - aro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: aro-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - aro-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "perl", "-MIO::Socket", "-e", "exit(!IO::Socket::INET->new(PeerAddr=>'127.0.0.1',PeerPort=>6333,Proto=>'tcp',Timeout=>1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: aro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aro-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: aro-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set aro-local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing aro-local/aro-files-dev &&
      mc anonymous set none aro-local/aro-files-dev
      "

  clamav:
    image: clamav/clamav:1.5.3@sha256:7f5389ccaa2368c383fa80e167ccfe44348d71e685f926fce4755eed1757673a
    container_name: aro-clamav
    volumes:
      - aro-clamav-data:/var/lib/clamav

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aro-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      ARO_ENV: development
      ARO_DEPLOYMENT_MODE: local-dev
      ARO_AUTO_MIGRATE: "true"
      # Integration execution stays disabled until every provider is configured
      # with real credentials and its OAuth/OIDC flow is verified.
      ARO_INTEGRATIONS_API_V2: "false"
      ARO_INTEGRATIONS_OAUTH_CONNECT: "false"
      ARO_INTEGRATIONS_READ_V2: "false"
      ARO_INTEGRATIONS_API_V3: "false"
      ARO_INTEGRATIONS_WORKERS: "false"
      ARO_INTEGRATIONS_WEBHOOKS: "false"
      ARO_INTEGRATIONS_EXECUTE: "false"
      ARO_INTEGRATIONS_THIRD_PARTY_NETWORK: "false"
      ARO_API_BIND: 0.0.0.0:8710
      ARO_CORS_ALLOWED_ORIGINS: http://localhost:1420,http://127.0.0.1:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost
      ARO_HTTP_MAX_BODY_BYTES: "1048576"
      ARO_JWT_SECRET: dev-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      ARO_SECRETS_KEY: dev-secrets-key-0123456789-abcdefghijklmnopqrstuvwxyz
      ARO_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://aro:aro@postgres:5432/aro
      RUST_LOG: aro_api=info,tower_http=info
      # Qdrant configuration
      ARO_QDRANT_URL: http://qdrant:6333
      # Ollama configuration
      ARO_OLLAMA_ENDPOINT: http://host.docker.internal:11434
      # S3/MinIO configuration
      ARO_FILES_API: "true"
      ARO_FILE_STORAGE_BACKEND: s3
      ARO_S3_ENDPOINT: http://minio:9000
      ARO_S3_BUCKET: aro-files-dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      ARO_CLAMAV_ADDRESS: clamav:3310
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8710:8710"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      ARO_ENV: development
      ARO_DEPLOYMENT_MODE: local-dev
      ARO_JWT_SECRET: dev-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      ARO_SECRETS_KEY: dev-secrets-key-0123456789-abcdefghijklmnopqrstuvwxyz
      ARO_REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://aro:aro@postgres:5432/aro
      ARO_FILES_API: "true"
      ARO_FILE_STORAGE_BACKEND: s3
      ARO_S3_ENDPOINT: http://minio:9000
      ARO_S3_BUCKET: aro-files-dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      ARO_CLAMAV_ADDRESS: clamav:3310
      RUST_LOG: aro_api=info

volumes:
  aro-postgres-data:
  aro-redis-data:
  aro-qdrant-data:
  aro-minio-data:
  aro-clamav-data:
