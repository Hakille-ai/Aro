x-aro-logging: &aro-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-aro-app-hardening: &aro-app-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging: *aro-logging

services:
  postgres:
    image: ${ARO_POSTGRES_IMAGE:?set ARO_POSTGRES_IMAGE to an immutable digest reference}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    logging: *aro-logging
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: aro
    secrets:
      - postgres_user
      - postgres_password
      - aro_app_password
      - aro_worker_password
    volumes:
      - aro-postgres-data:/var/lib/postgresql/data
      - aro-postgres-backups:/backups
      - ./postgres/initdb/10-aro-runtime-roles.sh:/docker-entrypoint-initdb.d/10-aro-runtime-roles.sh:ro
    networks: [aro-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d aro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${ARO_REDIS_IMAGE:?set ARO_REDIS_IMAGE to an immutable digest reference}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging: *aro-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aro-redis-data:/data
    networks: [aro-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: ${ARO_CLAMAV_IMAGE:?set ARO_CLAMAV_IMAGE to an immutable digest reference}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 5g
    cpus: 2.0
    logging: *aro-logging
    volumes:
      - aro-clamav-data:/var/lib/clamav
    networks: [aro-internal]

  migrate:
    <<: *aro-app-hardening
    image: ${ARO_API_IMAGE:?set ARO_API_IMAGE to an immutable digest reference}
    command: ["migrate"]
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env.production
        required: true
      - path: ../.env.production.migrate
        required: true
    networks: [aro-internal]

  api:
    <<: *aro-app-hardening
    image: ${ARO_API_IMAGE:?set ARO_API_IMAGE to an immutable digest reference}
    command: ["serve"]
    restart: unless-stopped
    stop_grace_period: 45s
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../.env.production
        required: true
      - path: ../.env.production.api
        required: true
    networks: [aro-internal]
    expose:
      - "8710"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *aro-app-hardening
    image: ${ARO_API_IMAGE:?set ARO_API_IMAGE to an immutable digest reference}
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../.env.production
        required: true
      - path: ../.env.production.worker
        required: true
    networks: [aro-internal]

  proxy:
    image: ${ARO_CADDY_IMAGE:?set ARO_CADDY_IMAGE to an immutable digest reference}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging: *aro-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      ARO_DOMAIN: ${ARO_DOMAIN:?set ARO_DOMAIN}
      ARO_ADMIN_EMAIL: ${ARO_ADMIN_EMAIL:?set ARO_ADMIN_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aro-caddy-data:/data
      - aro-caddy-config:/config
    networks:
      - aro-public
      - aro-internal

networks:
  aro-public:
  aro-internal:
    internal: true

volumes:
  aro-postgres-data:
  aro-postgres-backups:
  aro-redis-data:
  aro-clamav-data:
  aro-caddy-data:
  aro-caddy-config:

secrets:
  postgres_user:
    file: ./secrets/postgres_user
  postgres_password:
    file: ./secrets/postgres_password
  aro_app_password:
    file: ./secrets/aro_app_password
  aro_worker_password:
    file: ./secrets/aro_worker_password
