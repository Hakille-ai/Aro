{{- if .Values.clamav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aro.fullname" . }}-clamav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aro.fullname" . }}-clamav
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ include "aro.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.clamav.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.clamav.podSecurityContext | nindent 8 }}
      containers:
        - name: clamav
          image: {{ include "aro.dependencyImage" (list .Values.clamav.image .Values.clamav.digest) | quote }}
          imagePullPolicy: {{ .Values.clamav.imagePullPolicy }}
          securityContext:
{{ toYaml .Values.clamav.containerSecurityContext | nindent 12 }}
          ports:
            - name: clamd
              containerPort: {{ .Values.clamav.port }}
          startupProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: clamd
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
{{ toYaml .Values.clamav.resources | nindent 12 }}
          volumeMounts:
            - name: signatures
              mountPath: /var/lib/clamav
      volumes:
        - name: signatures
{{- if .Values.clamav.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-clamav-signatures" (include "aro.fullname" .)) .Values.clamav.persistence.existingClaim }}
{{- else }}
          emptyDir:
            sizeLimit: {{ .Values.clamav.signatureVolumeSizeLimit }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aro.fullname" . }}-clamav
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "aro.fullname" . }}-clamav
  ports:
    - name: clamd
      port: {{ .Values.clamav.port }}
      targetPort: clamd
{{- end }}
