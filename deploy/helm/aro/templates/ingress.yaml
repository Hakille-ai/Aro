{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aro.fullname" . }}-api
{{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
{{- end }}
spec:
{{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
{{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tlsSecretName is required when ingress.enabled=true" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aro.fullname" . }}-api
                port:
                  name: http
{{- end }}
