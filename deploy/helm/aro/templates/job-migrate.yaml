apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aro.migrationJobName" . }}
  labels:
    app.kubernetes.io/name: {{ include "aro.fullname" . }}-migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aro.fullname" . }}-migrate
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      restartPolicy: Never
      serviceAccountName: {{ include "aro.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "aro.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "aro.fullname" . }}-config
{{- with .Values.migration.extraEnvFrom }}
{{ toYaml . | nindent 12 }}
{{- end }}
          env:
            - name: ARO_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aro.secretName" . }}
                  key: ARO_MIGRATION_DATABASE_URL
          resources:
{{ toYaml .Values.migration.resources | nindent 12 }}
