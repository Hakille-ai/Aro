{{- if and .Values.networkPolicy.enabled .Values.clamav.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aro.fullname" . }}-clamav
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-clamav
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-worker
      ports:
        - protocol: TCP
          port: {{ .Values.clamav.port }}
{{- end }}
