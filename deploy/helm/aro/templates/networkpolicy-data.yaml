{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aro.fullname" . }}-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-migrate
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if and .Values.networkPolicy.enabled .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aro.fullname" . }}-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aro.fullname" . }}-worker
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
