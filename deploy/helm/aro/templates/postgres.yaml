{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aro.fullname" . }}-postgres
spec:
  serviceName: {{ include "aro.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aro.fullname" . }}-postgres
      annotations:
        checksum/role-init: {{ include (print $.Template.BasePath "/postgres-role-init.yaml") . | sha256sum }}
        checksum/postgres-secret: {{ include (print $.Template.BasePath "/secret-postgres.yaml") . | sha256sum }}
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ include "aro.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.postgres.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "aro.dependencyImage" (list .Values.postgres.image .Values.postgres.digest) | quote }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
          securityContext:
{{ toYaml .Values.postgres.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aro.postgresSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: ARO_POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aro.postgresSecretName" . }}
                  key: ARO_POSTGRES_APP_PASSWORD
            - name: ARO_POSTGRES_WORKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aro.postgresSecretName" . }}
                  key: ARO_POSTGRES_WORKER_PASSWORD
          startupProbe:
            exec:
              command: ["sh", "-ec", "pg_isready --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\""]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\""]
            periodSeconds: 30
            failureThreshold: 3
          resources:
{{ toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: role-init
              mountPath: /docker-entrypoint-initdb.d/10-aro-runtime-roles.sh
              subPath: 10-aro-runtime-roles.sh
              readOnly: true
      volumes:
        - name: role-init
          configMap:
            name: {{ include "aro.fullname" . }}-postgres-role-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aro.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "aro.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: postgres
{{- end }}
