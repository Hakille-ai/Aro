{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aro.fullname" . }}-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aro.fullname" . }}-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aro.fullname" . }}-redis
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ include "aro.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.redis.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.redis.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: {{ include "aro.dependencyImage" (list .Values.redis.image .Values.redis.digest) | quote }}
          imagePullPolicy: {{ .Values.redis.imagePullPolicy }}
          securityContext:
{{ toYaml .Values.redis.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: 6379
              name: redis
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
{{ toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aro.fullname" . }}-redis
spec:
  selector:
    app.kubernetes.io/name: {{ include "aro.fullname" . }}-redis
  ports:
    - port: 6379
      targetPort: redis
{{- end }}
