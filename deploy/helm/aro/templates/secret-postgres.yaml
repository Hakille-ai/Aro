{{- if and .Values.postgres.enabled (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aro.postgresSecretName" . }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password is required when the bundled PostgreSQL is enabled" .Values.postgres.password | quote }}
  ARO_POSTGRES_APP_PASSWORD: {{ required "postgres.appPassword is required when the bundled PostgreSQL is enabled" .Values.postgres.appPassword | quote }}
  ARO_POSTGRES_WORKER_PASSWORD: {{ required "postgres.workerPassword is required when the bundled PostgreSQL is enabled" .Values.postgres.workerPassword | quote }}
{{- end }}
