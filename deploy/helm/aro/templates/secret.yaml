{{- if .Values.secrets.create }}
{{- if or (lt (len .Values.secrets.jwtSecret) 64) (hasPrefix "replace-with" .Values.secrets.jwtSecret) }}
{{- fail "secrets.jwtSecret must be a non-placeholder value of at least 64 characters when secrets.create=true" }}
{{- end }}
{{- if or (lt (len .Values.secrets.secretsKey) 64) (hasPrefix "replace-with" .Values.secrets.secretsKey) }}
{{- fail "secrets.secretsKey must be a non-placeholder value of at least 64 characters when secrets.create=true" }}
{{- end }}
{{- if eq .Values.secrets.jwtSecret .Values.secrets.secretsKey }}
{{- fail "secrets.jwtSecret and secrets.secretsKey must be distinct" }}
{{- end }}
{{- if lt (len .Values.secrets.metricsToken) 32 }}
{{- fail "secrets.metricsToken must contain at least 32 characters when secrets.create=true" }}
{{- end }}
{{- if and (eq (index .Values.env "ARO_INVITATION_DELIVERY_ENABLED") "true") (not (eq (index .Values.env "ARO_SMTP_ALLOW_UNAUTHENTICATED") "true")) }}
{{- if or (eq .Values.secrets.smtpUsername "") (lt (len .Values.secrets.smtpPassword) 16) }}
{{- fail "secrets.smtpUsername and a smtpPassword of at least 16 characters are required when invitation delivery is enabled" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aro.fullname" . }}-secret
type: Opaque
stringData:
  DATABASE_URL: {{ include "aro.apiDatabaseUrl" . | quote }}
{{- if .Values.worker.enabled }}
  ARO_WORKER_DATABASE_URL: {{ include "aro.workerDatabaseUrl" . | quote }}
{{- end }}
  ARO_MIGRATION_DATABASE_URL: {{ include "aro.migrationDatabaseUrl" . | quote }}
{{- if .Values.secrets.redisUrl }}
  ARO_REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
{{- else if not .Values.redis.enabled }}
{{- fail "secrets.redisUrl is required when redis.enabled=false and secrets.create=true" }}
{{- end }}
  ARO_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  ARO_SECRETS_KEY: {{ .Values.secrets.secretsKey | quote }}
  ARO_METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
{{- if and (eq (index .Values.env "ARO_INVITATION_DELIVERY_ENABLED") "true") (ne (index .Values.env "ARO_SMTP_ALLOW_UNAUTHENTICATED") "true") }}
  ARO_SMTP_USERNAME: {{ .Values.secrets.smtpUsername | quote }}
  ARO_SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
{{- end }}
{{- end }}
